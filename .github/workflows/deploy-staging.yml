# Despliegue a STAGING. Solo manual (workflow_dispatch): nunca se dispara con un push ni un PR.
# Requiere el environment protegido `staging` en GitHub (Settings → Environments) con revisores
# obligatorios, sin auto-aprobación y con política de ramas de despliegue (solo `main`), y los
# secretos CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID de una cuenta (o un token) SIN alcance sobre
# producción (revisión de seguridad F6-01; docs/despliegue.md).
name: deploy-staging

on:
  workflow_dispatch:
    inputs:
      aplicar_migraciones:
        description: 'Aplicar migraciones D1 pendientes antes de desplegar'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  calidad:
    name: Gates antes de desplegar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  desplegar:
    name: Desplegar a staging
    needs: calidad
    runs-on: ubuntu-latest
    environment: staging
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      # Acciones fijadas por SHA completo (revisión de seguridad F6-01): este job recibe el token de
      # Cloudflare; un tag movido no puede cambiar el código que lo ve. Sin credenciales de git
      # persistidas y sin caché compartida en el job con secretos.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: false
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Compilar la PWA
        run: pnpm --filter @catmetal/web build
      - name: Aplicar migraciones D1 de staging
        if: ${{ inputs.aplicar_migraciones }}
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.156.0'
          packageManager: pnpm
          workingDirectory: apps/worker
          command: d1 migrations apply mp-staging --env staging --remote
      - name: Desplegar el Worker de staging
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.156.0'
          packageManager: pnpm
          workingDirectory: apps/worker
          command: deploy --env staging
